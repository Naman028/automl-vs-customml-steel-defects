[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv", "data/raw/gc10", "data/processed/neu", "reports/runs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "silent"
ignore_missing_imports = true
files = ["backend/core/config.py", "backend/inference/automl_contract.py", "backend/inference/neu.py", "backend/api/app.py", "backend/inference/routing.py", "backend/api/uploads.py", "backend/inference/preprocessing.py", "backend/integrations/vertex_ai.py", "ml/evaluation_metrics.py", "backend/inference/gc10_model.py", "backend/inference/gc10.py", "ml/evaluate_gc10.py", "scripts/download_weights.py", "scripts/prepare_data.py", "scripts/scan_secrets.py", "scripts/update_readme_results.py", "scripts/prepare_release_assets.py"]
explicit_package_bases = true
mypy_path = ["."]

[[tool.mypy.overrides]]
module = ["torchvision.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "requires_weights: needs locally provisioned model checkpoints or TFLite exports",
  "requires_datasets: needs locally provisioned NEU or GC10 data",
  "live_api: needs an explicitly started local backend",
]

[tool.coverage.run]
source = ["backend", "ml"]
omit = ["data/raw/gc10/*", "reports/runs/*", "data/processed/neu/*"]
