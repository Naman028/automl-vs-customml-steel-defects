name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      ENABLE_VERTEX_AI: "false"
      CUSTOM_MODEL_PATH: .ci-missing/custom.pt
      AUTOML_TFLITE_PATH: .ci-missing/automl.tflite
      GC10_OUTPUT_DIR: .ci-missing/gc10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements/requirements-dev.txt
      - run: ruff check backend ml tests scripts
      - run: ruff format --check backend ml tests scripts
      - run: mypy
      - run: python scripts/update_readme_results.py --check
      - run: python scripts/scan_secrets.py
      - run: pytest -m "not requires_weights and not requires_datasets and not live_api" --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
